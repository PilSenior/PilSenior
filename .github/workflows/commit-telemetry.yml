name: Commit telemetry
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: read
concurrency:
  group: commit-telemetry
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate public commit calendar
        env:
          GH_TOKEN: ${{ secrets.COMMIT_TELEMETRY_TOKEN || github.token }}
        run: python3 scripts/commit_telemetry.py --login PilSenior
      - name: Publish if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/commit-telemetry.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: refresh public commit telemetry'
          git push
